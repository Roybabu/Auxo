name: Android CI

# AUTOMATIC CI IS TEMPORARILY PAUSED for the current development period.
# The push and pull_request triggers are commented out below; run this workflow
# by hand from the Actions tab (workflow_dispatch). The jobs are unchanged.
# Before the final release verification, uncomment both triggers and run the
# whole workflow, including the emulator tests.
on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper JAR checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Output is saved so the summary step can report compiler errors as annotations.
      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build-logs
          ./gradlew assembleDebug 2>&1 | tee build-logs/assemble.log

      # Room writes its schema during the build. A difference means the database
      # changed without committing the new schema (and adding a migration).
      - name: Check Room schema is committed
        run: python3 .github/scripts/schema_check.py

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest 2>&1 | tee build-logs/test.log

      - name: Run Android lint
        shell: bash
        run: ./gradlew lintDebug 2>&1 | tee build-logs/lint.log

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/ci_summary.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: invision-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/screenshots/
            app/schemas/
            build-logs/
          if-no-files-found: ignore
          retention-days: 14

  device-tests:
    name: Device tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration, which the runner allows through KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and device tests
        shell: bash
        run: |
          mkdir -p build-logs
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee build-logs/device.log

      # Runs src/androidTest on an Android 15 emulator: PDF files, sharing,
      # printing and a full sale and return through the app.
      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Error dialogs from the emulator's own apps would take focus during the tests.
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            bash -c 'set -o pipefail; ./gradlew connectedDebugAndroidTest 2>&1 | tee -a build-logs/device.log'

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/ci_summary.py --device

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build-logs/
          if-no-files-found: ignore
          retention-days: 14
