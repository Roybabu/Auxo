name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper JAR checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Output is saved so the summary step can report compiler errors as annotations.
      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build-logs
          ./gradlew assembleDebug 2>&1 | tee build-logs/assemble.log

      # Room writes its schema during the build. A difference means the database
      # changed without committing the new schema (and adding a migration).
      # Room writes its schema during the build. A difference means the database
      # changed without committing the new schema (and adding a migration).
      - name: Check Room schema is committed
        run: python3 .github/scripts/schema_check.py

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest 2>&1 | tee build-logs/test.log

      - name: Run Android lint
        shell: bash
        run: ./gradlew lintDebug 2>&1 | tee build-logs/lint.log

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/ci_summary.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: invision-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/screenshots/
            app/schemas/
            build-logs/
          if-no-files-found: ignore
          retention-days: 14
