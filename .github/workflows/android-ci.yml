name: Android CI

on:
  push:
    branches: [main, UI, Supplimentary]
  pull_request:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick run: build and unit tests only (no lint, release build, emulator or coverage)'
        type: boolean
        default: false
      tests:
        description: 'Quick run: only tests matching this pattern, e.g. *ThermalReceiptPrinterTest (empty = all unit tests)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper JAR checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Output is saved so the summary step can report compiler errors as annotations.
      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build-logs
          ./gradlew assembleDebug 2>&1 | tee build-logs/assemble.log

      # Room writes its schema during the build. A difference means the database
      # changed without committing the new schema (and adding a migration).
      - name: Check Room schema is committed
        run: python3 .github/scripts/schema_check.py

      # Libraries add permissions of their own; this lists them and fails on any not expected.
      - name: Check merged manifest permissions
        run: python3 .github/scripts/manifest_permissions.py

      - name: Run unit tests
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.tests }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            ./gradlew testDebugUnitTest --tests "$TEST_FILTER" 2>&1 | tee build-logs/test.log
          else
            ./gradlew testDebugUnitTest 2>&1 | tee build-logs/test.log
          fi

      - name: Show which fragment library version the app uses
        shell: bash
        run: |
          v=$(./gradlew -q :app:dependencyInsight --dependency androidx.fragment:fragment --configuration debugRuntimeClasspath 2>&1 | grep -m1 -E "androidx.fragment:fragment:[0-9]" || true)
          echo "::notice title=Fragment library::$v"

      - name: Run Android lint
        if: ${{ !inputs.quick }}
        shell: bash
        run: ./gradlew lintDebug 2>&1 | tee build-logs/lint.log

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/ci_summary.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: auxo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/screenshots/
            app/schemas/
            build-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Looks for committed secrets, unsafe manifest or workflow settings, and the prohibited
  # integration name, then checks that the release variant still compiles (unsigned).
  security:
    if: ${{ !inputs.quick }}
    name: Security checks and release build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Scan tracked files
        run: python3 .github/scripts/security_check.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No signing keys are used; this only proves the release variant compiles and passes lint's vital checks.
      - name: Build unsigned release APK
        shell: bash
        run: |
          mkdir -p build-logs
          ./gradlew assembleRelease 2>&1 | tee build-logs/release.log

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-log
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14

  device-tests:
    if: ${{ !inputs.quick }}
    name: Device tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration, which the runner allows through KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and device tests
        shell: bash
        run: |
          mkdir -p build-logs
          ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee build-logs/device.log

      # Runs src/androidTest on an Android 15 emulator: PDF files, sharing,
      # printing and a full sale and return through the app.
      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Error dialogs from the emulator's own apps would take focus during the tests.
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            bash -c 'set -o pipefail; ./gradlew connectedDebugAndroidTest 2>&1 | tee -a build-logs/device.log'

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/ci_summary.py --device

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Measures how much of the app the unit tests run. Reported only; it does not block the build.
  coverage:
    if: ${{ !inputs.quick }}
    name: Unit test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests with coverage
        shell: bash
        run: |
          mkdir -p build-logs
          ./gradlew -Pcoverage createDebugUnitTestCoverageReport 2>&1 | tee build-logs/coverage.log

      # Shows why the run failed in the annotations, since the logs are not always readable.
      - name: Show end of coverage log
        if: failure()
        run: |
          tail -n 40 build-logs/coverage.log | python3 -c "import sys; print('::error title=Coverage log::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"

      - name: Summarize coverage
        if: always()
        run: python3 .github/scripts/coverage_summary.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            app/build/reports/coverage/
            build-logs/coverage.log
          if-no-files-found: ignore
          retention-days: 14
