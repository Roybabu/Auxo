# Builds a signed release APK when a version tag such as v0.4.0 is pushed, and publishes it as a GitHub Release.
# Needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$name" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $name in app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auxo-release.jks"

      - name: Build signed release APK
        env:
          AUXO_KEYSTORE_FILE: ${{ runner.temp }}/auxo-release.jks
          AUXO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AUXO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AUXO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$apk"
          cp "$apk" "Auxo-${GITHUB_REF_NAME}.apk"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/auxo-release.jks"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/mapping/release/mapping.txt "mapping-${GITHUB_REF_NAME}.txt"
          gh release create "$GITHUB_REF_NAME" "Auxo-${GITHUB_REF_NAME}.apk" "mapping-${GITHUB_REF_NAME}.txt" \
            --title "Auxo ${GITHUB_REF_NAME}" --generate-notes
