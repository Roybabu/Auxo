name: Preview screenshots (temporary)

on:
  push:
    branches: [step-2-inventory]

permissions:
  contents: write

concurrency:
  group: preview-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Render screens
        run: ./gradlew testDebugUnitTest --tests '*ScreenTest' --tests '*AppFlowTest'
      - name: Publish screenshots to a throwaway branch
        if: always()
        run: |
          set -e
          ls app/build/outputs/screenshots || exit 0
          mkdir -p /tmp/shots && cp app/build/outputs/screenshots/*.png /tmp/shots/
          git config user.name "ci-preview"
          git config user.email "ci-preview@users.noreply.github.com"
          git checkout --orphan preview-shots
          git rm -rf --cached . > /dev/null
          git clean -fdq
          cp /tmp/shots/*.png .
          git add *.png
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push origin "HEAD:refs/heads/preview-shots-${GITHUB_RUN_NUMBER}"
