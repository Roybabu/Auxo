name: Preview screenshots (temporary)

on:
  push:
    branches: [step-3-billing]

permissions:
  contents: write

concurrency:
  group: preview-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Render screens and receipts
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --tests '*BillingScreenTest' --tests '*.ScreenTest' --tests '*AppFlowTest'
      - name: Commit screenshots to the ci-screenshots branch
        run: |
          set -e
          ls app/build/outputs/screenshots/*.png >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/shots && cp app/build/outputs/screenshots/*.png /tmp/shots/
          git config user.name "ci-preview"
          git config user.email "ci-preview@users.noreply.github.com"
          if git fetch -q origin ci-screenshots; then
            git checkout -q -B ci-screenshots FETCH_HEAD
          else
            git checkout -q --orphan ci-screenshots
            git rm -rfq --cached .
          fi
          git clean -fdqx
          rm -f ./*.png
          cp /tmp/shots/*.png .
          git add -A .
          git commit -qm "Screenshots for ${GITHUB_SHA::7}" || exit 0
          git push -q origin HEAD:refs/heads/ci-screenshots
